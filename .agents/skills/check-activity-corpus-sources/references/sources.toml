[policy]
timezone = "Asia/Singapore"
results_dir = "results/hfl"
max_backfill_days = 15
corpus_es_skew_minutes = 10
daily_schedule_owner = "Hermes"
weekly_schedule_owner = "Celery Beat"
low_risk_main_push_requires_approval_ref = true

# Every active WORKFLOW_HFL task is represented below. Manual, hook-driven,
# and Hermes-owned producers are retained too so they cannot silently disappear
# merely because they do not have an active Beat entry.

[[sources]]
key = "capture"
kind = "source"
monitor_mode = "manual"
task = "workflows.hfl.tasks.capture.capture_hfl_entry"
entry_sources = ["capture"]
schedule = "manual; Sunday 03:33 Beat invocation is an intentional empty no-op"
expects_entry = true
allow_empty = true
auto_retry = false
backfill = "manual"
related_tasks = ["workflows.hfl.tasks.persist.persist_hfl_entry"]

[[sources]]
key = "desktop"
kind = "source"
monitor_mode = "scheduled"
task = "workflows.hfl.tasks.analyze_desktop_capture.analyze_desktop_capture"
entry_sources = ["desktop"]
schedule = "daily 22:00"
task_max_age_hours = 36
entry_max_age_hours = 72
expects_entry = true
allow_empty = true
auto_retry = true
backfill = "task-window"
related_tasks = ["workflows.hfl.tasks.analyze_media.analyze_hfl_media"]

