      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/pins:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: List Pins
      operationId: list_pins_api_hfl_pins_get
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Create Pin
      description: Pin a date or inclusive date range, with agent execution disabled
        even with a prompt.
      operationId: create_pin_api_hfl_pins_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePin'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/pins/{pin_id}:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Get Pin
      operationId: get_pin_api_hfl_pins__pin_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: integer
          title: Pin Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Update Pin
      operationId: update_pin_api_hfl_pins__pin_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: integer
          title: Pin Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePin'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Delete Pin
      operationId: delete_pin_api_hfl_pins__pin_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: integer
          title: Pin Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - operations
      summary: Service health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
      security: []
  /api/hfl/entries:
    post:
      tags:
      - hfl-corpus-api
      summary: Hfl Api Create Entry
      operationId: hfl_api_create_entry_api_hfl_entries_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
        required: true
      responses:
        '200':
