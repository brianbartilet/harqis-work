        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Q
      - name: date_field
        in: query
        required: false
        schema:
          type: string
          default: created
          title: Date Field
      - name: date_from
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Date To
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: desc
          title: Sort
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: compact
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Compact
      - name: include_entries
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Entries
      - name: source
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Source
      - name: include_secrets
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Secrets
      - name: secret_tags
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Secret Tags
      - name: activity_year
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Activity Year
      - name: activity_from_year
        in: query
        required: false
        schema:
          type: integer
          default: 0
