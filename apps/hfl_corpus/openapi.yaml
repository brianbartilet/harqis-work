components:
  schemas:
    AuditRequest:
      properties:
        run_id:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,100}$
          title: Run Id
      type: object
      required:
      - run_id
      title: AuditRequest
    RoleWrite:
      properties:
        revision:
          type: integer
          minimum: 0.0
          title: Revision
          default: 0
        name:
          type: string
          maxLength: 100
          minLength: 1
          pattern: \S
          title: Name
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          title: Color
          default: '#3b82f6'
        soul:
          type: string
          maxLength: 100000
          title: Soul
          default: ''
        workspace_ids:
          items:
            type: string
          type: array
          maxItems: 30
          title: Workspace Ids
        entity_ids:
          items:
            type: string
          type: array
          maxItems: 100
          title: Entity Ids
        archived:
          type: boolean
          title: Archived
          default: false
      additionalProperties: false
      type: object
      required:
      - name
      title: RoleWrite
    ActionSource:
      properties:
        path:
          type: string
          title: Path
        entry_id:
          type: string
          title: Entry Id
      additionalProperties: false
      type: object
      required:
      - path
      - entry_id
      title: ActionSource
    Body_hfl_api_upload_entry_api_hfl_entries_upload_post:
      properties:
        payload:
          type: string
          title: Payload
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          default: []
      type: object
      required:
      - payload
      title: Body_hfl_api_upload_entry_api_hfl_entries_upload_post
    Body_upload_api_hfl_timeline_ideas_objects__identity__attachments_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
      type: object
      required:
      - files
      title: Body_upload_api_hfl_timeline_ideas_objects__identity__attachments_post
    Body_upload_attachments_api_hfl__resource___source_id__attachments_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
      type: object
      required:
      - files
      title: Body_upload_attachments_api_hfl__resource___source_id__attachments_post
    CreateAction:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
          description: Caller-generated UUID. Reuse unchanged on retry.
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        expected_outcome:
          type: string
          maxLength: 3000
          title: Expected Outcome
          default: ''
        review_date:
          type: string
          title: Review Date
          default: ''
        due_date:
          type: string
          title: Due Date
          default: ''
        prompt:
          type: string
          maxLength: 20000
          title: Prompt
          default: ''
        notes:
          type: string
          maxLength: 6000
          title: Notes
          default: ''
        description:
          type: string
          maxLength: 3000
          title: Description
          default: ''
        body:
          type: string
          maxLength: 50000
          title: Body
          default: ''
        checklists:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 20
          title: Checklists
        hide_ticked:
          type: boolean
          title: Hide Ticked
          default: false
        source:
          anyOf:
          - $ref: '#/components/schemas/ActionSource'
          - type: 'null'
        matrix:
          type: string
          enum:
          - ''
          - Q1
          - Q2
          - Q3
          - Q4
          title: Matrix
          default: ''
        matrix_confidence:
          type: string
          enum:
          - ''
          - high
          - medium
          - low
          title: Matrix Confidence
          default: ''
        matrix_reason:
          type: string
          maxLength: 3000
          title: Matrix Reason
          default: ''
        board_ids:
          items:
            type: string
          type: array
          maxItems: 10000
          title: Board Ids
      additionalProperties: false
      type: object
      required:
      - request_id
      - title
      title: CreateAction
    CreateEntryRequest:
      properties:
        date:
          type: string
          maxLength: 10
          title: Date
        time:
          type: string
          maxLength: 8
          title: Time
        moment:
          type: string
          maxLength: 500
          title: Moment
        what_happened:
          type: string
          maxLength: 20000
          title: What Happened
        why_it_stayed:
          type: string
          maxLength: 10000
          title: Why It Stayed
          default: ''
        possible_use:
          type: string
          maxLength: 5000
          title: Possible Use
          default: ''
        source:
          type: string
          maxLength: 120
          minLength: 1
          title: Source
          default: manual-entry
        tags:
          type: string
          maxLength: 2000
          title: Tags
          default: ''
        references:
          type: string
          maxLength: 20000
          title: References
          default: ''
        attachment_names:
          items:
            type: string
          type: array
          maxItems: 50
          title: Attachment Names
        include_location:
          type: boolean
          title: Include Location
          default: true
        browser_latitude:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Browser Latitude
        browser_longitude:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Browser Longitude
        browser_location_status:
          type: string
          maxLength: 40
          title: Browser Location Status
          default: ''
      type: object
      required:
      - date
      - time
      - moment
      - what_happened
      title: CreateEntryRequest
      description: Browser/API payload for one manual HFL entry.
    CreatePin:
      properties:
        category_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Category Id
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        title:
          type: string
          maxLength: 2000
          minLength: 1
          title: Title
        note:
          type: string
          maxLength: 2000
          title: Note
          default: ''
        prompt:
          type: string
          maxLength: 20000
          title: Prompt
          default: ''
      additionalProperties: false
      type: object
      required:
      - category_id
      - start_date
      - end_date
      - title
      title: CreatePin
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Layout:
      properties:
        positions:
          additionalProperties:
            $ref: '#/components/schemas/Position'
          type: object
          title: Positions
        center:
          additionalProperties:
            type: number
          propertyNames:
            enum:
            - x
            - y
          type: object
          title: Center
        zoom:
          type: number
          exclusiveMinimum: 0.0
          title: Zoom
          default: 1
      type: object
      title: Layout
    Merge:
      properties:
        alias:
          type: string
          maxLength: 100
          title: Alias
        canonical:
          type: string
          maxLength: 100
          title: Canonical
        reason:
          type: string
          maxLength: 1000
          minLength: 5
          title: Reason
      type: object
      required:
      - alias
      - canonical
      - reason
      title: Merge
    MergeFields:
      properties:
        categories:
          items:
            type: string
          type: array
          title: Categories
        emails:
          items:
            type: string
          type: array
          title: Emails
        phones:
          items:
            type: string
          type: array
          title: Phones
        references:
          items:
            type: string
          type: array
