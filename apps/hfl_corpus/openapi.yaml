openapi: 3.1.0
info:
  title: HARQIS HFL Activity Corpus API
  version: 1.0.0
  description: >-
    Authenticated API for writing the canonical Homework-for-Life Markdown corpus
    and its best-effort Elasticsearch projection, then searching and retrieving it.
    Manage actions, Memory Signal categories, and date pins. New management API
    actions and pins have scheduled agent execution disabled.
servers:
  - url: http://localhost:8082
    description: Standalone hfl-api daemon
security:
  - HTTPBearer: []
tags:
  - name: hfl-corpus-api
    description: Canonical Activity Corpus operations
  - name: operations
    description: Service operations
  - name: hfl-management
    description: Actions, Memory Signal categories, and date pins
paths:
  /api/hfl/{resource}/{source_id}/attachments:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: List Attachments
      operationId: list_attachments_api_hfl__resource___source_id__attachments_get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          enum:
          - actions
          - pins
          type: string
          title: Resource
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Upload Attachments
      description: Attach multiple inputs; identical name/content retries are deduplicated.
      operationId: upload_attachments_api_hfl__resource___source_id__attachments_post
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          enum:
          - actions
          - pins
          type: string
          title: Resource
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_attachments_api_hfl__resource___source_id__attachments_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/{resource}/{source_id}/attachments/{attachment_id}:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Download Attachment
      description: Download immutable input, including detached files retained for prior
        runs.
      operationId: download_attachment_api_hfl__resource___source_id__attachments__attachment_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          enum:
          - actions
          - pins
          type: string
          title: Resource
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Detach Attachment
      description: Remove an input from future runs; preserve files referenced by run
        history.
      operationId: detach_attachment_api_hfl__resource___source_id__attachments__attachment_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          enum:
          - actions
          - pins
          type: string
          title: Resource
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/actions:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: List Actions
      description: List up to 500 open or closed actions; continue using offset and
        total.
      operationId: list_actions_api_hfl_actions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: closed
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Closed
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Create Action
      description: Create standalone or entry-linked intent with scheduled agent execution
        disabled.
      operationId: create_action_api_hfl_actions_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAction'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '200':
          description: Idempotent replay
        '409':
          description: Request ID already used with different content
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/actions/{action_id}:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Get Action
      operationId: get_action_api_hfl_actions__action_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Update Action
      description: Edit or complete/dismiss an action. Completion retains the existing
        HFL receipt behavior.
      operationId: update_action_api_hfl_actions__action_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAction'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '409':
          description: Stale version
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/actions/{action_id}/history:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Action History
      operationId: action_history_api_hfl_actions__action_id__history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/categories:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: List Categories
      operationId: list_categories_api_hfl_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    post:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Create Category
      operationId: create_category_api_hfl_categories_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCategory'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/hfl/categories/{category_id}:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Get Category
      operationId: get_category_api_hfl_categories__category_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Update Category
      operationId: update_category_api_hfl_categories__category_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
          title: Category Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategory'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/categories/{category_id}/archive:
    post:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Archive Category
      description: Archive a category and hide its pins without deleting their history.
      operationId: archive_category_api_hfl_categories__category_id__archive_post
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/pins:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: List Pins
      operationId: list_pins_api_hfl_pins_get
      security:
      - HTTPBearer: []
      parameters:
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Create Pin
      description: Pin a date or inclusive date range, with agent execution disabled
        even with a prompt.
      operationId: create_pin_api_hfl_pins_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePin'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/pins/{pin_id}:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Get Pin
      operationId: get_pin_api_hfl_pins__pin_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: integer
          title: Pin Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Update Pin
      operationId: update_pin_api_hfl_pins__pin_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: integer
          title: Pin Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePin'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Delete Pin
      operationId: delete_pin_api_hfl_pins__pin_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: integer
          title: Pin Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags: [operations]
      summary: Service health
      security: []
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: hfl-api}
  /api/hfl/entries:
    post:
      tags: [hfl-corpus-api]
      summary: Create a canonical HFL entry
      description: >-
        Writes the canonical Markdown entry and attempts an idempotent Elasticsearch
        projection. A successful Markdown write can return indexed=false when ES is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
      responses:
        '200':
          description: Entry persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResult'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/entries/preview:
    post:
      tags: [hfl-corpus-api]
      summary: Preview and enrich an entry without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryRequest'
      responses:
        '200':
          description: Rendered preview
          content:
            application/json:
              schema:
                type: object
                required: [filename, markdown, html, payload, enrichment]
                properties:
                  filename: {type: string}
                  markdown: {type: string}
                  html: {type: string}
                  payload: {$ref: '#/components/schemas/CreateEntryRequest'}
                  enrichment: {type: object, additionalProperties: true}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/entries/upload:
    post:
      tags: [hfl-corpus-api]
      summary: Create an entry with attachments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: JSON-encoded CreateEntryRequest
                files:
                  type: array
                  maxItems: 10
                  items: {type: string, format: binary}
      responses:
        '200':
          description: Entry and attachments persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResult'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/documents:
    get:
      tags: [hfl-corpus-api]
      summary: Search and paginate corpus documents
      parameters:
        - {$ref: '#/components/parameters/Query'}
        - {name: date_field, in: query, schema: {type: string, enum: [created, updated], default: created}}
        - {name: date_from, in: query, schema: {type: string}}
        - {name: date_to, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, default: 20}}
        - {name: compact, in: query, schema: {type: boolean, default: false}}
        - {name: source, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/IncludeSecrets'}
        - {$ref: '#/components/parameters/SecretTags'}
      responses:
        '200':
          description: Corpus search result
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/tree:
    get:
      tags: [hfl-corpus-api]
      summary: Return a shallow corpus directory tree
      parameters:
        - {name: path, in: query, schema: {type: string, default: ''}}
        - {$ref: '#/components/parameters/IncludeSecrets'}
        - {$ref: '#/components/parameters/SecretTags'}
      responses:
        '200':
          description: Directory tree
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/matches/{relative_path}:
    get:
      tags: [hfl-corpus-api]
      summary: Find matching entries within one document
      parameters:
        - {$ref: '#/components/parameters/RelativePath'}
        - {$ref: '#/components/parameters/Query'}
        - {name: source, in: query, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 20}}
        - {$ref: '#/components/parameters/IncludeSecrets'}
        - {$ref: '#/components/parameters/SecretTags'}
      responses:
        '200':
          description: Matching entries
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/document/{relative_path}:
    get:
      tags: [hfl-corpus-api]
      summary: Retrieve one corpus document
      parameters:
        - {$ref: '#/components/parameters/RelativePath'}
        - {$ref: '#/components/parameters/IncludeSecrets'}
        - {$ref: '#/components/parameters/SecretTags'}
      responses:
        '200':
          description: Document, entries, and safe references
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [hfl-corpus-api]
      summary: Replace a corpus Markdown document
      description: Destructive. Validates and replaces the complete document text.
      parameters:
        - {$ref: '#/components/parameters/RelativePath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string}
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: {type: boolean}
                  relative_path: {type: string}
                  size: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/reference/{token}:
    get:
      tags: [hfl-corpus-api]
      summary: Download a referenced file
      parameters:
        - {$ref: '#/components/parameters/ReferenceToken'}
      responses:
        '200': {$ref: '#/components/responses/BinaryFile'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/reference/{token}/preview:
    get:
      tags: [hfl-corpus-api]
      summary: Preview a safe text or Markdown reference
      parameters:
        - {$ref: '#/components/parameters/ReferenceToken'}
      responses:
        '200':
          description: HTML preview
          content:
            text/html:
              schema: {type: string}
        '204': {description: Media reference; use the media endpoint}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {description: Reference type cannot be previewed}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/reference/{token}/media:
    get:
      tags: [hfl-corpus-api]
      summary: Stream image or video reference content
      parameters:
        - {$ref: '#/components/parameters/ReferenceToken'}
      responses:
        '200': {$ref: '#/components/responses/BinaryFile'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {description: Reference is not media}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/reference/{token}/thumbnail:
    get:
      tags: [hfl-corpus-api]
      summary: Download a generated media thumbnail
      parameters:
        - {$ref: '#/components/parameters/ReferenceToken'}
      responses:
        '200': {$ref: '#/components/responses/BinaryFile'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {description: Thumbnail is unavailable}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hfl/day-matches/{activity_day}:
    get:
      tags:
      - hfl-corpus-api
      summary: Hfl Api Day Matches
      operationId: hfl_api_day_matches_api_hfl_day_matches__activity_day__get
      security:
      - HTTPBearer: []
      parameters:
      - name: activity_day
        in: path
        required: true
        schema:
          type: string
          format: date
          title: Activity Day
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Q
      - name: source
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Source
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: include_secrets
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Secrets
      - name: secret_tags
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Secret Tags
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/timeline/source:
    get:
      tags:
      - hfl-corpus-api
      summary: Followup Source
      operationId: followup_source_api_hfl_timeline_source_get
      security:
      - HTTPBearer: []
      parameters:
      - name: path
        in: query
        required: true
        schema:
