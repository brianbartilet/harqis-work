        schema:
          type: integer
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: include_secrets
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Secrets
      - name: secret_tags
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Secret Tags
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/document/{relative_path}:
    get:
      tags:
      - hfl-corpus-api
      summary: Hfl Api Document
      operationId: hfl_api_document_api_hfl_document__relative_path__get
      security:
      - HTTPBearer: []
      parameters:
      - name: relative_path
        in: path
        required: true
        schema:
          type: string
          title: Relative Path
      - name: include_secrets
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Secrets
      - name: secret_tags
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Secret Tags
      responses:
        '200':
