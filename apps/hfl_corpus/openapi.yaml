components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
  schemas:
    Body_hfl_api_upload_entry_api_hfl_entries_upload_post:
      properties:
        payload:
          type: string
          title: Payload
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          default: []
      type: object
      required:
      - payload
      title: Body_hfl_api_upload_entry_api_hfl_entries_upload_post
    Body_upload_attachments_api_hfl__resource___source_id__attachments_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
      type: object
      required:
      - files
      title: Body_upload_attachments_api_hfl__resource___source_id__attachments_post
    UpdateDocumentRequest:
      properties:
        text:
          type: string
          maxLength: 5000000
          title: Text
        expected_updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Updated At
      type: object
      required:
      - text
      title: UpdateDocumentRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ActionSource:
      properties:
        path:
          type: string
          title: Path
        entry_id:
          type: string
          title: Entry Id
      additionalProperties: false
      type: object
      required:
      - path
      - entry_id
      title: ActionSource
    CreateAction:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
          description: Caller-generated UUID. Reuse unchanged on retry.
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        expected_outcome:
          type: string
          maxLength: 3000
          minLength: 1
          title: Expected Outcome
        review_date:
          type: string
          title: Review Date
          default: ''
        due_date:
          type: string
          title: Due Date
          default: ''
        prompt:
          type: string
          maxLength: 20000
          title: Prompt
          default: ''
        notes:
          type: string
          maxLength: 6000
          title: Notes
          default: ''
        source:
          anyOf:
          - $ref: '#/components/schemas/ActionSource'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - request_id
      - title
      - expected_outcome
      title: CreateAction
    CreatePin:
      properties:
        category_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Category Id
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        title:
          type: string
          maxLength: 2000
          minLength: 1
          title: Title
        note:
          type: string
          maxLength: 2000
          title: Note
          default: ''
        prompt:
          type: string
          maxLength: 20000
          title: Prompt
          default: ''
      additionalProperties: false
      type: object
      required:
      - category_id
      - start_date
      - end_date
      - title
      title: CreatePin
    SaveCategory:
      properties:
        name:
          type: string
          maxLength: 60
          minLength: 1
          title: Name
        color:
          type: string
          title: Color
          description: A color from GET /categories palette.
        instructions:
          type: string
          maxLength: 20000
          title: Instructions
          default: ''
      additionalProperties: false
      type: object
      required:
      - name
      - color
      title: SaveCategory
    UpdateAction:
      properties:
        version:
          type: integer
          minimum: 1.0
          title: Version
          description: Version returned by the latest read; stale versions return 409.
        title:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Title
        expected_outcome:
          anyOf:
          - type: string
            maxLength: 3000
            minLength: 1
          - type: 'null'
          title: Expected Outcome
        review_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Review Date
        due_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Due Date
        prompt:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Prompt
        notes:
          anyOf:
          - type: string
            maxLength: 6000
          - type: 'null'
          title: Notes
        status:
          anyOf:
          - type: string
            enum:
            - open
            - active
            - in_progress
            - incomplete
            - done
            - dismissed
          - type: 'null'
          title: Status
        completion_note:
          anyOf:
          - type: string
            maxLength: 3000
          - type: 'null'
          title: Completion Note
      additionalProperties: false
      type: object
      required:
      - version
      title: UpdateAction
    UpdateCategory:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 60
            minLength: 1
          - type: 'null'
          title: Name
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        instructions:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Instructions
      additionalProperties: false
      type: object
      title: UpdateCategory
    UpdatePin:
      properties:
        category_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Category Id
        start_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Start Date
        end_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End Date
        title:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 1
          - type: 'null'
          title: Title
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
        prompt:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Prompt
      additionalProperties: false
      type: object
      title: UpdatePin
    CreateEntryRequest:
      type: object
      required: [date, time, moment, what_happened]
      properties:
        date: {type: string, format: date, maxLength: 10}
        time: {type: string, maxLength: 8, examples: ['14:30']}
        moment: {type: string, minLength: 1, maxLength: 500}
        what_happened: {type: string, minLength: 1, maxLength: 20000}
        why_it_stayed: {type: string, maxLength: 10000, default: ''}
        possible_use: {type: string, maxLength: 5000, default: ''}
        source: {type: string, minLength: 1, maxLength: 120, default: manual-entry}
        tags: {type: string, maxLength: 2000, default: '', examples: ['#notes #manual-entry']}
        references: {type: string, maxLength: 20000, default: ''}
        attachment_names:
          type: array
          maxItems: 10
          items: {type: string}
          default: []
        include_location: {type: boolean, default: true}
        browser_latitude: {type: [number, 'null'], minimum: -90, maximum: 90}
        browser_longitude: {type: [number, 'null'], minimum: -180, maximum: 180}
        browser_location_status: {type: string, maxLength: 40, default: ''}
    EntryResult:
      type: object
      required: [entry_id, path, duplicate, indexed, delivery]
      properties:
        entry_id: {type: string}
        path: {type: string}
        bytes_written: {type: integer}
        duplicate: {type: boolean}
        indexed:
          type: boolean
          description: Whether the best-effort Elasticsearch upsert succeeded.
        doc_id: {type: [string, 'null']}
        delivery: {type: string, enum: [persisted, forwarded, outbox]}
        uploads:
          type: array
          items: {type: string}
  parameters:
    Query:
      name: q
      in: query
      schema: {type: string, default: ''}
    IncludeSecrets:
      name: include_secrets
      in: query
      schema: {type: boolean, default: false}
    SecretTags:
      name: secret_tags
      in: query
      schema: {type: string, default: ''}
    RelativePath:
      name: relative_path
      in: path
      required: true
      schema: {type: string}
    ReferenceToken:
      name: token
      in: path
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    NotFound:
      description: Corpus resource not found
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    BinaryFile:
      description: Binary file content
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
