openapi: 3.1.0
info:
  title: HARQIS HFL Activity Corpus API
  summary: Capture and query Homework-for-Life entries, actions, categories, and date
    pins.
  description: Authenticated API for writing the canonical Markdown Activity Corpus
    and its best-effort Elasticsearch projection, plus searching and retrieving entries.
    Manage actions, Memory Signal categories, and date pins with bearer authentication.
    New management API actions and pins have scheduled agent execution disabled.
  version: 1.0.0
servers:
- url: http://localhost:8082
  description: Standalone hfl-api daemon
security:
- HTTPBearer: []
tags:
- name: hfl-corpus-api
  description: Canonical Activity Corpus operations
- name: operations
  description: Service operations
- name: hfl-management
  description: Actions, Memory Signal categories, and date pins
paths:
  /api/hfl/timeline/ideas/share-context/attachments/{kind}/{source_id}/{attachment_id}:
    get:
      summary: Download immutable workspace sharing attachment input
      description: Service bearer authentication only. Browser/proxy requests are forbidden. Publication authorization is enforced by the sharing service.
      operationId: hfl_workspace_share_attachment
      tags: [hfl-corpus-api]
      parameters:
      - {name: kind, in: path, required: true, schema: {type: string, enum: [actionable, idea]}}
      - {name: source_id, in: path, required: true, schema: {type: string}}
      - {name: attachment_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Attachment bytes
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {description: Invalid bearer token}
        '403': {description: Browser/proxy access forbidden}
        '404': {description: Attachment unavailable}
  /api/hfl/timeline/ideas/share-context:
    get:
      summary: Read canonical input for workspace sharing
      description: Service-bearer-only canonical object snapshot. Browser proxy access is forbidden. The sharing service must enforce PIN authorization and publication scope before exposing any content.
      operationId: hfl_workspace_share_context
      tags: [hfl-corpus-api]
      responses:
        '200':
          description: Canonical actions, ideas, maps, goals, lists and links for server-side projection
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Invalid service bearer token
        '403':
          description: Browser or proxy access forbidden
  /api/hfl/timeline/items/{followup_id}/checklist-action:
    post:
      tags:
      - hfl-corpus-api
      summary: Checklist Action
      operationId: checklist_action_api_hfl_timeline_items__followup_id__checklist_action_post
      security:
      - HTTPBearer: []
      parameters:
      - name: followup_id
        in: path
        required: true
        schema:
          type: string
          title: Followup Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/{resource}/{source_id}/attachments:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: List Attachments
      operationId: list_attachments_api_hfl__resource___source_id__attachments_get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          enum:
          - actions
          - pins
          type: string
          title: Resource
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Upload Attachments
      description: Attach multiple inputs; identical name/content retries are deduplicated.
      operationId: upload_attachments_api_hfl__resource___source_id__attachments_post
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          enum:
          - actions
          - pins
          type: string
          title: Resource
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_attachments_api_hfl__resource___source_id__attachments_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/{resource}/{source_id}/attachments/{attachment_id}:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Download Attachment
      description: Download immutable input, including detached files retained for
        prior runs.
      operationId: download_attachment_api_hfl__resource___source_id__attachments__attachment_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          enum:
          - actions
          - pins
          type: string
          title: Resource
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Detach Attachment
      description: Remove an input from future runs; preserve files referenced by
        run history.
      operationId: detach_attachment_api_hfl__resource___source_id__attachments__attachment_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          enum:
          - actions
          - pins
          type: string
          title: Resource
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          title: Source Id
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/actions:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: List Actions
      description: List up to 500 open or closed actions; continue using offset and
        total.
      operationId: list_actions_api_hfl_actions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: closed
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Closed
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Create Action
      description: Create standalone or entry-linked intent with scheduled agent execution
        disabled.
      operationId: create_action_api_hfl_actions_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAction'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '200':
          description: Idempotent replay
        '409':
          description: Request ID already used with different content
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/actions/{action_id}:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Get Action
      operationId: get_action_api_hfl_actions__action_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Update Action
      description: Edit or complete/dismiss an action. Completion retains the existing
        HFL receipt behavior.
      operationId: update_action_api_hfl_actions__action_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAction'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '409':
          description: Stale version
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/hfl/actions/{action_id}/history:
    get:
      tags:
      - hfl-corpus-api
      - hfl-management
      summary: Action History
      operationId: action_history_api_hfl_actions__action_id__history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      responses:
        '200':
          description: Successful Response
