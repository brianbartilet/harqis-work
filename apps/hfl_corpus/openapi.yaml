      operationId: hfl_api_matches_api_hfl_matches__relative_path__get
      security:
      - HTTPBearer: []
      parameters:
      - name: relative_path
        in: path
        required: true
        schema:
          type: string
          title: Relative Path
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Q
      - name: source
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Source
      - name: offset
        in: query
