name: HARQIS-WORK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ trigger-harqis-work-tests ]

permissions:
  contents: read

jobs:
  frontend-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:frontend-assets
      - run: node --test frontend/tests/tailwind-assets.test.mjs

  run-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Set Up Git Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Build Docker Image
      run: docker build --no-cache -t harqis-work .

    - name: Check Frontend MCP Coverage
      run: docker run --rm harqis-work python -m tools.frontend_coverage --check

    - name: Test Frontend MCP Contracts
      run: |
        docker run --rm -e APP_CONFIG_FILE=apps_config.yaml harqis-work \
          python -m pytest frontend/tests/test_mcp_coverage.py frontend/tests/test_hfl_api_server.py -q

    - name: Test Deployment Lifecycle Contracts
      run: |
        docker run --rm harqis-work sh -c \
          'python -m pytest scripts/tests/test_deploy_*.py scripts/tests/test_launch*.py -q'

    - name: Test Share Agent Readiness Contracts
      run: |
        docker run --rm harqis-work \
          python -m pytest scripts/tests/test_setup_hfl_share_hermes.py -q

    - name: Run Tests
      run: |
        docker run --rm -e APP_CONFIG_FILE=apps_config.yaml harqis-work \
          python -m pytest agents/projects/tests/ tools/tests/ -m "not integration" -v
