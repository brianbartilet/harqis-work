name: HARQIS-WORK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ trigger-harqis-work-tests ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Set Up Git Repository
      uses: actions/checkout@v2

    - name: Build Docker Image
      run: docker build --no-cache -t harqis-work .

    - name: Check Frontend MCP Coverage
      run: docker run --rm harqis-work python -m tools.frontend_coverage --check

    - name: Test Frontend MCP Contracts
      run: |
        docker run --rm -e APP_CONFIG_FILE=apps_config.yaml harqis-work \
          python -m pytest frontend/tests/test_mcp_coverage.py frontend/tests/test_hfl_api_server.py -q

    - name: Test Deployment Lifecycle Contracts
      run: |
        docker run --rm harqis-work sh -c \
          'python -m pytest scripts/tests/test_deploy_*.py scripts/tests/test_launch*.py -q'

    - name: Run Tests
      run: |
        docker run --rm -e APP_CONFIG_FILE=apps_config.yaml harqis-work \
          python -m pytest agents/projects/tests/ tools/tests/ -m "not integration" -v
