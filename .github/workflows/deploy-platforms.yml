name: Deployment platforms

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-contracts:
    name: Deployment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated contract-test dependencies
        run: python -m pip install 'pytest>=8,<9' 'celery>=5.4,<6' 'httpx>=0.28.1,<1' python-dotenv pytest-dotenv
      - name: Test deployment and launcher contracts
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          tests = sorted({*Path('scripts/tests').glob('test_deploy_*.py'),
                          *Path('scripts/tests').glob('test_launch*.py')})
          if not tests:
              raise SystemExit('No deployment contract tests found')
          subprocess.run([sys.executable, '-m', 'pytest', '-q',
                          *map(str, tests)], check=True)
      - name: Test dumps scanning and process supervision
        run: python -m pytest scripts/agents/dumps/tests -q
