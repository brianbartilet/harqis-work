<dialog data-secrets-pin-dialog aria-labelledby="secrets-pin-title"
        class="m-auto w-[min(28rem,calc(100%-2rem))] rounded-2xl border border-violet-800/70 bg-slate-950 p-0 text-slate-100 shadow-2xl shadow-black/70 backdrop:bg-black/75">
  <form method="dialog" data-secrets-pin-form class="p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))] sm:p-6">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-xs uppercase tracking-[0.2em] text-violet-400">Protected activity</p>
        <h2 id="secrets-pin-title" class="mt-1 text-xl font-semibold text-white">Unlock secrets</h2>
        <p class="mt-2 text-sm leading-relaxed text-slate-400">Enter your six-digit Activity Corpus PIN.</p>
      </div>
      <button type="button" data-secrets-pin-close aria-label="Close PIN dialog"
              class="flex min-h-11 min-w-11 items-center justify-center rounded-lg text-2xl text-slate-500 hover:bg-slate-900 hover:text-white sm:min-h-0 sm:min-w-0 sm:px-2 sm:py-1 sm:text-xl">×</button>
    </div>

    <label class="mt-5 block text-sm font-medium text-slate-300" for="secrets-pin-input">Six-digit PIN
      <input id="secrets-pin-input" data-secrets-pin-input name="pin" type="password"
             inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="current-password" required
             class="mt-1.5 block min-h-12 w-full rounded-lg bg-slate-900 px-3 py-2 text-center font-mono text-xl tracking-[0.35em] text-white ring-1 ring-slate-700 focus:outline-none focus:ring-2 focus:ring-violet-500">
    </label>
    <p data-secrets-pin-error hidden role="alert" aria-live="assertive"
       class="mt-3 rounded-lg border border-rose-800/70 bg-rose-950/50 px-3 py-2 text-sm text-rose-200"></p>

    <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end sm:gap-3">
      <button type="button" data-secrets-pin-cancel
              class="min-h-11 w-full rounded-lg bg-slate-900 px-4 py-2 text-sm text-slate-300 ring-1 ring-slate-700 hover:text-white sm:min-h-0 sm:w-auto">Cancel</button>
      <button type="submit" data-secrets-pin-submit
              class="min-h-11 w-full rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-500 disabled:cursor-wait disabled:opacity-60 sm:min-h-0 sm:w-auto">Unlock</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const dialog = document.querySelector('[data-secrets-pin-dialog]');
  const form = dialog?.querySelector('[data-secrets-pin-form]');
  const input = dialog?.querySelector('[data-secrets-pin-input]');
  const error = dialog?.querySelector('[data-secrets-pin-error]');
  const submit = dialog?.querySelector('[data-secrets-pin-submit]');
  const cancel = dialog?.querySelector('[data-secrets-pin-cancel]');
  const close = dialog?.querySelector('[data-secrets-pin-close]');
  if (!dialog || !form || !input || !error || !submit || !cancel || !close) return;

  let resolveRequest = null;
  const finish = unlocked => {
    const resolve = resolveRequest;
    resolveRequest = null;
    form.reset();
    error.textContent = '';
    error.hidden = true;
    if (dialog.open) dialog.close();
    resolve?.(unlocked);
  };
  const abort = () => finish(false);

  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    error.hidden = true;
  });
  cancel.addEventListener('click', abort);
  close.addEventListener('click', abort);
  dialog.addEventListener('cancel', event => {
    event.preventDefault();
    abort();
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!/^\d{6}$/.test(input.value)) {
      error.textContent = 'Enter exactly six digits.';
      error.hidden = false;
      input.focus();
      return;
    }
    submit.disabled = true;
    const label = submit.textContent;
    submit.textContent = 'Unlocking…';
    error.hidden = true;
    try {
      const response = await fetch('/hfl-corpus/secrets/unlock', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pin: input.value}),
      });
      const body = await response.json();
      if (!response.ok) {
        error.textContent = body.detail || 'Secrets could not be unlocked.';
        error.hidden = false;
        input.value = '';
        input.focus();
        return;
      }
      finish(true);
    } catch (_) {
      error.textContent = 'Secrets could not be unlocked. Check your connection and try again.';
      error.hidden = false;
      input.value = '';
      input.focus();
    } finally {
      submit.disabled = false;
      submit.textContent = label;
    }
  });

  window.requestHflSecretsUnlock = () => {
    if (resolveRequest) return Promise.resolve(false);
    form.reset();
    error.textContent = '';
    error.hidden = true;
    dialog.showModal();
    requestAnimationFrame(() => input.focus());
    return new Promise(resolve => { resolveRequest = resolve; });
  };
})();
</script>
