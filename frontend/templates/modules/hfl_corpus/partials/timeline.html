<link rel="stylesheet" href="{{ static_asset('css/hfl-timeline.css') }}">
<section id="followup-agenda" class="agenda" aria-label="Ideas" hidden>
  <form id="timeline-period-form" hidden><input id="timeline-start" type="date"><input id="timeline-end" type="date"></form>
  <div class="timeline-analysis-box">
  <div class="timeline-dialog-tools"><span>Suggestions for this period</span><button type="button" id="timeline-explore">Explore</button></div>
  <div id="timeline-run" role="status" aria-live="polite" class="timeline-run"><span class="timeline-run-icon" aria-hidden="true"></span><div><p id="timeline-run-title"></p><p id="timeline-run-detail"></p></div></div>
  </div>
  <div id="timeline-suggestions"></div>
</section>
<section id="timeline-actions" class="agenda" aria-label="Actions" hidden>
  <input type="checkbox" id="timeline-all" hidden>
  <div class="agenda-toolbar"><div class="agenda-tabs" aria-label="Follow-up status"><button type="button" data-agenda-closed="false" aria-pressed="true">Open actions</button><button type="button" data-agenda-closed="true" aria-pressed="false">Completed</button></div><button type="button" id="agenda-refresh">Refresh</button></div>
  <p id="agenda-status" class="agenda-description" role="status" aria-live="polite">Loading follow-ups…</p>
  <p id="agenda-error" class="agenda-error" role="alert" hidden></p>
  <div id="agenda-items"></div>
  <p class="agenda-footnote">Singapore time · Planned dots don’t change activity counts.</p>
</section>
<dialog id="followup-editor" class="agenda-dialog" aria-labelledby="followup-editor-title">
  <form id="followup-form">
    <header class="agenda-dialog-header"><h2 id="followup-editor-title">New actionable</h2><button type="button" data-agenda-close aria-label="Close follow-up editor">×</button></header>
    <div class="agenda-form-body">
      <p id="followup-evidence" class="agenda-evidence" hidden></p>
      <label>Actionable<input name="title" required maxlength="200" placeholder="Check Essential Space sync feasibility"></label>
      <label>Expected outcome<textarea name="expected_outcome" required maxlength="3000" rows="3" placeholder="What would a useful, completed result look like?"></textarea></label>
      <div class="agenda-form-dates"><label>Review on<input name="review_date" type="date"><small>Revisit this action or check progress. Adds a heatmap marker; no notification.</small></label><label>Complete by<input name="due_date" type="date" required><small>When the outcome needs to be ready.</small></label></div>
      <label id="followup-state-label">Status<select name="status"><option value="open">Open</option><option value="active">Active</option><option value="in_progress">In Progress</option><option value="done">Done</option><option value="dismissed">Dismissed</option></select></label>
      <label>Prompt<textarea name="prompt" rows="5" maxlength="20000" placeholder="Write instructions for an LLM. Plain text or Markdown is supported."></textarea><small>Saved instructions for later use. Nothing runs when you save.</small></label>
      <label>Notes<textarea name="notes" rows="2" maxlength="6000" placeholder="Useful context or the next step"></textarea></label>
      <label id="followup-completion-label">Completion note<textarea name="completion_note" rows="2" maxlength="3000" placeholder="What happened? What was the result?"></textarea></label>
      <p id="followup-save-error" class="agenda-error" role="alert" hidden></p>
    </div>
    <footer class="agenda-dialog-footer"><button type="button" data-agenda-close>Cancel</button><button type="submit" class="agenda-primary">Save</button></footer>
  </form>
</dialog>
<dialog id="followup-history" class="agenda-dialog" aria-labelledby="followup-history-title"><header class="agenda-dialog-header"><h2 id="followup-history-title">Follow-up history</h2><button type="button" id="followup-history-close" aria-label="Close history">×</button></header><div id="followup-history-items" class="agenda-form-body"></div></dialog>
<script defer src="{{ static_asset('js/hfl-timeline.js') }}"></script>
