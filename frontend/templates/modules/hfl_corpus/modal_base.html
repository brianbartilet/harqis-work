<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Activity{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="{{ static_asset('favicon.svg') }}">
  <link rel="stylesheet" href="{{ static_asset('css/app.min.css') }}">
  <link rel="stylesheet" href="{{ static_asset('css/activity-modals.css') }}">
  <link rel="stylesheet" href="{{ static_asset('css/activity-header-sizing.css') }}">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ static_asset('css/control-focus.css') }}">
</head><body class="activity-modal-page bg-slate-950 text-slate-100">
{% if request.query_params.get('embed') != '1' and request.url.path.endswith('/entities') %}<dialog id="activity-standalone" class="activity-modal activity-modal-page {% block modal_class %}{% endblock %}">{% endif %}
{% block content %}{% endblock %}
{% if request.query_params.get('embed') != '1' and request.url.path.endswith('/entities') %}</dialog><script>document.getElementById('activity-standalone').showModal();</script>{% endif %}
<script src="{{ static_asset('js/activity-modals.js') }}"></script>
<link rel="stylesheet" href="{{ static_asset('css/context-help.css') }}">
<link rel="stylesheet" href="{{ static_asset('css/activity-hotkeys.css') }}">
<script src="{{ static_asset('js/activity-hotkeys.js') }}"></script>
<script src="{{ static_asset('js/activity-dialog-dismiss.js') }}"></script>
</body></html>
