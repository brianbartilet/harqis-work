{% extends "base.html" %}
{% block title %}HARQIS — Second Brain{% endblock %}
{% block head %}
<style>
  .brain-shell { display:grid; gap:1.25rem; }
  .brain-layout { display:grid; gap:1rem; align-items:start; }
  .brain-primary { display:grid; gap:1rem; }
  .brain-control-rail { min-width:0; }
  .brain-control-panel { overflow:hidden; box-shadow:0 16px 40px rgba(2,6,23,.22); }
  .brain-automatic-row { background:linear-gradient(135deg,rgba(15,23,42,.94),rgba(8,47,73,.22)); }
  .brain-control-summary::-webkit-details-marker { display:none; }

  .brain-control-summary:hover { background:rgba(15,23,42,.72); }
  .brain-control-action { display:inline-flex; align-items:center; gap:.4rem; color:#94a3b8; font-size:.75rem; }
  .brain-control-action::before { content:"Show"; }
  .brain-control-disclosure[open] .brain-control-action::before { content:"Hide"; }
  .brain-control-chevron { width:1rem; height:1rem; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s ease; }
  .brain-control-disclosure[open] .brain-control-chevron { transform:rotate(180deg); }

  .brain-manage-button:hover { border-color:rgba(34,211,238,.65); color:#fff; }
  .brain-mode-pill { position:relative; display:inline-flex; min-height:2.6rem; align-items:center; gap:.5rem; border-width:1.5px; border-color:color-mix(in srgb,var(--mode-color) 48%,#334155); color:color-mix(in srgb,var(--mode-color) 74%,white); background:color-mix(in srgb,var(--mode-color) 8%,transparent); font-weight:550; transition:border-color .2s ease,background-color .2s ease,box-shadow .2s ease,transform .2s ease; }
  .brain-mode-pill::before { width:.45rem; height:.45rem; border-radius:999px; background:var(--mode-color); content:""; opacity:.5; }
  .brain-mode-pill:not(:disabled):hover { border-color:var(--mode-color); background:color-mix(in srgb,var(--mode-color) 15%,#020617); }
  .brain-mode-pill[data-selected="true"] { transform:translateY(-1px); border-color:color-mix(in srgb,var(--mode-color) 82%,white); color:white; background:color-mix(in srgb,var(--mode-color) 38%,#020617); box-shadow:0 0 0 2px color-mix(in srgb,var(--mode-color) 26%,transparent),0 10px 28px color-mix(in srgb,var(--mode-color) 25%,transparent),inset 0 1px rgba(255,255,255,.16); }
  .brain-mode-pill[data-selected="true"]::before { opacity:1; box-shadow:0 0 10px var(--mode-color); }
  .brain-feed-launcher { box-shadow:inset 0 1px rgba(148,163,184,.04); }

  .brain-view-feed { background:linear-gradient(90deg,#22d3ee,#38bdf8); color:#082f49; transition:filter .2s ease,transform .2s ease; }
  .brain-view-feed:hover { filter:brightness(1.08); }
  .brain-view-feed:active { transform:translateY(1px); }
  .brain-view-feed-count { border-radius:999px; background:rgba(8,47,73,.14); padding:.2rem .55rem; font-size:.7rem; font-weight:600; }
  .brain-feed-dialog { width:min(70rem,calc(100% - 2rem)); max-width:none; box-shadow:0 30px 90px rgba(2,6,23,.72); }
  .brain-feed-dialog::backdrop { background:rgba(2,6,23,.78); backdrop-filter:blur(8px); }
  .brain-feed-dialog-frame { max-height:94vh; overflow:hidden; }
  .brain-feed-dialog-header { background:rgba(15,23,42,.96); }
  .brain-dialog-mode { display:inline-flex; align-items:center; gap:.35rem; border:1px solid color-mix(in srgb,var(--mode-color) 38%,#334155); border-radius:999px; padding:.15rem .45rem; color:color-mix(in srgb,var(--mode-color) 72%,white); font-size:.65rem; line-height:1; }
  .brain-dialog-mode > span { width:.35rem; height:.35rem; border-radius:999px; background:var(--mode-color); box-shadow:0 0 8px var(--mode-color); }
  .brain-feed-close { display:grid; width:2.25rem; height:2.25rem; flex:none; place-items:center; border:1px solid #334155; border-radius:999px; color:#94a3b8; }
  .brain-feed-close:hover { border-color:#22d3ee; color:#fff; }
  .brain-feed-close svg { width:1rem; height:1rem; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; }

  .brain-feed::-webkit-scrollbar { display:none; }
  .brain-feed-track { display:flex; flex-direction:column; gap:.75rem; }
  .brain-card { position:relative; flex:none; overflow:hidden; }
  .brain-card::before { position:absolute; inset:0 auto 0 0; width:3px; content:""; background:var(--mode-color); }
  .brain-card[data-expanded="true"] { border-color:color-mix(in srgb,var(--mode-color) 60%,#334155); box-shadow:0 12px 35px rgba(2,6,23,.38); }
  .brain-card-toggle { display:block; border:0; background:transparent; color:inherit; }
  .brain-card-toggle:hover { background:rgba(30,41,59,.3); }
  .brain-card-header { display:grid; grid-template-columns:minmax(0,1fr) 4rem; align-items:start; gap:.75rem; }
  .brain-card-copy { min-width:0; text-align:left; }
  .brain-card-copy h3,.brain-card-copy p { text-align:left; }
  .brain-card-signal { width:4rem; text-align:right; }
  .brain-card-toggle-label::before { content:"Open"; }
  .brain-card[data-expanded="true"] .brain-card-toggle-label::before { content:"Close"; }
  .brain-card-expanded[hidden] { display:none; }
  .brain-card-scroll { max-height:min(50vh,26rem); overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; scrollbar-gutter:stable; scrollbar-color:#334155 transparent; background:rgba(2,6,23,.5); }
  .brain-card-scroll::-webkit-scrollbar { width:.55rem; }
  .brain-card-scroll::-webkit-scrollbar-thumb { border:2px solid #020617; border-radius:999px; background:#475569; }
  [data-feed-item][aria-hidden="true"] .brain-card-toggle { pointer-events:none; }
  .brain-category-dot { background:var(--mode-color); box-shadow:0 0 12px var(--mode-color); }
  .brain-result pre { overflow:auto; border:1px solid #1e293b; border-radius:.5rem; background:#020617; padding:.75rem; }
  .brain-card-summary { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .brain-result > :first-child { margin-top:0; }
  .brain-result > :last-child { margin-bottom:0; }
  .brain-result table { width:100%; border-collapse:collapse; }
  .brain-result th,.brain-result td { border-bottom:1px solid #1e293b; padding:.4rem; text-align:left; }
  .brain-switch input { position:absolute; opacity:0; }
  .brain-switch span { display:block; width:2.75rem; height:1.5rem; border-radius:999px; background:#334155; position:relative; cursor:pointer; }
  .brain-switch span::after { content:""; position:absolute; width:1.1rem; height:1.1rem; left:.2rem; top:.2rem; border-radius:50%; background:white; transition:.2s; }

  .brain-chat-submit { min-width:5rem; background:#22d3ee; color:#082f49; transition:background-color .2s ease, transform .2s ease; }
  .brain-chat-submit:hover { background:#67e8f9; }
  .brain-chat-submit:active { transform:translateY(1px); }
  .brain-dialog::backdrop { backdrop-filter:blur(8px); }
  .brain-settings-dialog { width:min(60rem,calc(100% - 2rem)); max-width:none; max-height:calc(100dvh - 2rem); overflow:hidden; box-shadow:0 30px 90px rgba(2,6,23,.72); }
  .brain-settings-dialog[open] { display:flex; flex-direction:column; }
  .brain-settings-dialog > :first-child { flex:none; }
  .brain-settings-header { flex-wrap:wrap; gap:.75rem; }
  .brain-settings-header > div { min-width:0; }
  .brain-settings-body { min-height:0; flex:1 1 auto; overflow-y:auto; }
  .brain-settings-dialog::backdrop { background:rgba(2,6,23,.78); }
  .brain-create-panel { background:linear-gradient(135deg,rgba(8,47,73,.34),rgba(15,23,42,.38)); }
  .brain-category-editor > summary::-webkit-details-marker,.brain-locked-list > summary::-webkit-details-marker { display:none; }
  .brain-category-editor > summary:hover { background:rgba(15,23,42,.7); }
  .brain-editor-color { width:.65rem; height:2rem; flex:none; border-radius:999px; background:var(--mode-color); box-shadow:0 0 14px color-mix(in srgb,var(--mode-color) 55%,transparent); }
  .brain-editor-chevron { width:1rem; height:1rem; flex:none; fill:none; stroke:#64748b; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s ease; }
  .brain-category-editor[open] .brain-editor-chevron { transform:rotate(180deg); }
  .brain-category-editor[open] .brain-editor-action { color:#67e8f9; }
  .brain-option-list { max-height:10rem; overflow-y:auto; overscroll-behavior:contain; border:1px solid #1e293b; border-radius:.6rem; background:rgba(15,23,42,.45); padding:.35rem; scrollbar-color:#334155 transparent; }
  .brain-option-row { display:flex; align-items:flex-start; gap:.55rem; border-radius:.4rem; padding:.42rem .5rem; line-height:1.25; }
  .brain-option-row:hover { background:rgba(30,41,59,.55); }
  .brain-option-row input { margin-top:.05rem; flex:none; accent-color:#22d3ee; }
  .brain-option-row small { display:block; margin-top:.15rem; color:#475569; }
  .brain-locked-list > summary { cursor:pointer; color:#64748b; }
  .brain-locked-list > summary:hover { color:#94a3b8; }
  .brain-number-stepper { display:grid; grid-template-columns:2.5rem minmax(0,1fr) 2.5rem; min-height:2.65rem; overflow:hidden; border:1px solid #334155; border-radius:.6rem; background:#0f172a; }
  .brain-number-stepper:focus-within { border-color:#22d3ee; box-shadow:0 0 0 2px rgba(34,211,238,.18); }
  .brain-number-stepper button { border:0; background:#1e293b; color:#cbd5e1; font-size:1.1rem; }
  .brain-number-stepper button:hover { background:#334155; color:white; }
  .brain-number-stepper input { min-width:0; border:0; background:transparent; padding:.55rem .75rem; color:white; text-align:center; outline:none; appearance:textfield; }
  .brain-number-stepper input::-webkit-inner-spin-button,.brain-number-stepper input::-webkit-outer-spin-button { margin:0; appearance:none; }
  .brain-notice { position:fixed; z-index:80; top:1rem; left:50%; width:min(34rem,calc(100% - 2rem)); transform:translateX(-50%); border:1px solid #475569; border-radius:.75rem; background:#0f172a; padding:.8rem 1rem; color:#e2e8f0; box-shadow:0 18px 50px rgba(2,6,23,.62); font-size:.875rem; }
  .brain-notice[data-tone="error"] { border-color:#fb7185; color:#ffe4e6; }
  .brain-notice[data-tone="success"] { border-color:#22d3ee; color:#cffafe; }
  .brain-notice[hidden] { display:none; }
  .brain-primary-action:focus-visible,.brain-mode-pill:focus-visible,.brain-control-summary:focus-visible,.brain-card-toggle:focus-visible,.brain-number-stepper button:focus-visible,.brain-manage-button:focus-visible { outline:2px solid #67e8f9; outline-offset:-2px; }
  .brain-pulse { animation:brain-breathe 2.4s ease-in-out infinite; }
  @keyframes brain-breathe { 50% { opacity:.35; transform:scale(.8); } }
  @media (min-width:1024px) {
    .brain-layout { grid-template-columns:minmax(0,1fr) 21rem; gap:1.25rem; }
    .brain-primary { grid-column:1; grid-row:1; }
    .brain-control-rail { position:sticky; top:1rem; grid-column:2; grid-row:1; }
  }
  @media (max-width:639px) {
    .brain-shell { gap:1rem; }
    .brain-feed-dialog { width:calc(100% - 1rem); }
    .brain-feed { height:72vh; padding:.75rem; }
    .brain-chat-form { grid-template-columns:1fr; }
    .brain-primary-action { min-height:3.25rem; }
  }
  @media (prefers-reduced-motion:reduce) { .brain-pulse { animation:none; } }
</style>
{% endblock %}
{% block content %}
<main class="mx-auto max-w-7xl px-4 py-5 sm:px-6 lg:px-8"><div id="second-brain-shell">{% include "modules/second_brain/_shell.html" %}</div></main>
<script>
(function () {
  var stream, tickerFrame, tickerResumeTimer, tickerEvents, countdownTimer, noticeTimer, settingsDirty=false, settingsDialogOpen=false, controlsExpanded=false, feedDialogOpen=false, currentKey = '';

  function showNotice(message,tone){var notice=document.getElementById('brain-notice');if(!notice)return;clearTimeout(noticeTimer);notice.textContent=message;notice.dataset.tone=tone||'error';notice.hidden=false;noticeTimer=setTimeout(()=>notice.hidden=true,5000);}
  function refreshFeed() { var visible=document.querySelector('[data-ticker-original].brain-visible');var controls=document.querySelector('[data-controls-panel]'),feedDialog=document.getElementById('brain-feed-dialog'),settingsDialog=document.getElementById('brain-settings-dialog');currentKey=visible?visible.dataset.logicalKey:currentKey;controlsExpanded=controls?controls.open:controlsExpanded;feedDialogOpen=feedDialog?feedDialog.open:feedDialogOpen;settingsDialogOpen=settingsDialog?settingsDialog.open:settingsDialogOpen;htmx.ajax('GET','/second-brain/feed-fragment',{target:'#second-brain-shell',swap:'innerHTML'}); }
  function formatDuration(value) { var n=Number(value), h=Math.floor(n/60), m=n%60; return (h?h+'h ':'')+(m?m+'m':''); }
  function selectedModes() { return Array.from(document.querySelectorAll('.brain-mode-pill[data-selected="true"]')).map(x=>x.dataset.modeId); }
  function setupTicker() {
    cancelAnimationFrame(tickerFrame);clearTimeout(tickerResumeTimer);if(tickerEvents)tickerEvents.abort();tickerEvents=new AbortController();
    var feed=document.getElementById('brain-feed'),track=feed&&feed.querySelector('[data-ticker-track]');if(!track)return;

    function appendCycle(){originals.forEach(card=>{var clone=card.cloneNode(true);clone.removeAttribute('data-ticker-original');clone.setAttribute('aria-hidden','true');clone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));clone.querySelectorAll('[aria-controls]').forEach(el=>el.removeAttribute('aria-controls'));clone.querySelectorAll('a,button,input,textarea,select').forEach(el=>el.setAttribute('tabindex','-1'));track.appendChild(clone);});}

      originals.forEach(card=>{var toggle=card.querySelector('[data-card-toggle]'),panel=card.querySelector('[data-card-expanded]');if(!toggle||!panel)return;toggle.onclick=()=>{var opening=panel.hidden;originals.forEach(other=>{var otherPanel=other.querySelector('[data-card-expanded]'),otherToggle=other.querySelector('[data-card-toggle]');if(otherPanel)otherPanel.hidden=true;if(otherToggle)otherToggle.setAttribute('aria-expanded','false');other.dataset.expanded='false';});panel.hidden=!opening;toggle.setAttribute('aria-expanded',opening?'true':'false');card.dataset.expanded=opening?'true':'false';currentKey=card.dataset.logicalKey;requestAnimationFrame(setupTicker);};});

    tickerFrame=requestAnimationFrame(()=>startTicker(0));
  }
  function setupBrain() {

    var slider=document.getElementById('brain-duration'), label=document.getElementById('brain-duration-label'); if(slider){var remembered=sessionStorage.getItem('secondBrainDuration');if(remembered)slider.value=remembered;label.textContent=formatDuration(slider.value);slider.oninput=()=>{label.textContent=formatDuration(slider.value);sessionStorage.setItem('secondBrainDuration',slider.value);};}
    clearInterval(countdownTimer);var expires=shell.dataset.expires; if(expires){var countdown=document.getElementById('brain-countdown'); var tick=()=>{var ms=new Date(expires)-Date.now();if(ms<=0){countdown.textContent='Returning to Automatic Feed…';clearInterval(countdownTimer);setTimeout(refreshFeed,1000);return;}var min=Math.ceil(ms/60000);countdown.textContent=formatDuration(min)+' remaining';};tick();countdownTimer=setInterval(tick,30000);}
    document.querySelectorAll('.brain-mode-pill').forEach(p=>p.onclick=()=>{var previous=p.dataset.selected;p.dataset.selected=previous==='true'?'false':'true';var modes=selectedModes();if(!modes.length){p.dataset.selected='true';showNotice('Keep at least one category selected.');return;}jsonPost('/second-brain/selection',{modes:modes,duration_minutes:Number(slider.value)}).then(refreshFeed).catch(e=>{p.dataset.selected=previous;showNotice(e.message);});});
    var automatic=document.getElementById('brain-automatic-toggle'); if(automatic)automatic.onchange=()=>jsonPost('/second-brain/automatic',{enabled:automatic.checked,modes:selectedModes(),duration_minutes:Number(slider.value)}).then(refreshFeed).catch(e=>{automatic.checked=!automatic.checked;showNotice(e.message);});
    document.querySelectorAll('.brain-delivery').forEach(c=>c.onchange=()=>{var s=document.getElementById('brain-delivery-status');s.textContent='Saving…';jsonPost('/second-brain/delivery/'+c.dataset.client,{enabled:c.checked}).then(()=>s.textContent='Saved.').catch(e=>{c.checked=!c.checked;s.textContent=e.message;});});
    var settingsDialog=document.getElementById('brain-settings-dialog');document.querySelectorAll('[data-open-brain-settings]').forEach(b=>b.onclick=()=>{settingsDialogOpen=true;settingsDialog.showModal();});document.querySelectorAll('[data-close-brain-settings]').forEach(b=>b.onclick=()=>{settingsDialogOpen=false;settingsDialog.close();if(settingsDirty){settingsDirty=false;refreshFeed();}});if(settingsDialogOpen&&!settingsDialog.open)settingsDialog.showModal();
    async function saveCategory(form){var fd=new FormData(form);fd.set('calendar_categories',fd.getAll('calendar_choice').join(','));fd.set('operation_ids',fd.getAll('operation_choice').join(','));fd.set('client_eligibility',fd.getAll('client_choice').join(','));var status=form.querySelector('.brain-form-status');if(status)status.textContent='Saving…';var r=await fetch('/second-brain/categories',{method:'POST',body:fd});var p=await r.json();if(!r.ok){if(status)status.textContent=p.error;showNotice(p.error);return false;}if(status)status.textContent='Saved.';settingsDirty=true;return true;}
    document.querySelectorAll('.brain-category-form').forEach(form=>{var timer;form.onsubmit=e=>e.preventDefault();form.onchange=()=>{clearTimeout(timer);timer=setTimeout(()=>saveCategory(form),350);};});var newForm=document.getElementById('brain-new-category');if(newForm)newForm.onsubmit=async e=>{e.preventDefault();if(await saveCategory(newForm))refreshFeed();};
    document.querySelectorAll('[data-number-step]').forEach(button=>button.onclick=()=>{var input=button.parentElement.querySelector('input[type="number"]');if(!input)return;Number(button.dataset.numberStep)>0?input.stepUp():input.stepDown();input.dispatchEvent(new Event('change',{bubbles:true}));});
    document.querySelectorAll('[data-archive-mode]').forEach(b=>b.onclick=()=>jsonPost('/second-brain/categories/'+b.dataset.archiveMode+'/archive',{}).then(refreshFeed).catch(e=>showNotice(e.message)));
    var hermes=document.getElementById('brain-hermes'),retention=document.getElementById('brain-chat-retention'),agentStatus=document.getElementById('brain-agent-status'); function saveAgent(){agentStatus.textContent='Saving…';jsonPost('/second-brain/agent-settings',{hermes_enabled:hermes.checked,chat_retention_hours:Number(retention.value)}).then(()=>agentStatus.textContent='Saved.').catch(e=>agentStatus.textContent=e.message);} if(hermes)hermes.onchange=saveAgent;if(retention)retention.onchange=saveAgent;
    var chat=document.getElementById('brain-chat-form'); if(chat)chat.onsubmit=async e=>{e.preventDefault();var input=document.getElementById('brain-chat-input'),status=document.getElementById('brain-chat-status'),message=input.value.trim();if(!message)return;input.value='';status.textContent='Thinking from your current briefing…';try{var response=await fetch('/second-brain/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:message})});var text=await response.text();if(text.includes('event: answer')){status.textContent='Answer added.';refreshFeed();}else status.textContent='Advisory answer unavailable; context was still recorded.';}catch(error){status.textContent='Could not reach the advisory channel.';showNotice('Could not reach the advisory channel.');}};
  }
  document.addEventListener('DOMContentLoaded',()=>{setupBrain();stream=new EventSource('/second-brain/api/events');stream.addEventListener('feed',refreshFeed);});document.body.addEventListener('htmx:afterSwap',setupBrain);window.addEventListener('beforeunload',()=>{if(stream)stream.close();cancelAnimationFrame(tickerFrame);clearTimeout(tickerResumeTimer);if(tickerEvents)tickerEvents.abort();clearInterval(countdownTimer);});
})();
</script>
{% endblock %}
