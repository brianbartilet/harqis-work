{% extends "base.html" %}
{% block title %}HARQIS — Second Brain{% endblock %}
{% block head %}
<style>
  .brain-shell { display:grid; gap:1.25rem; }
  .brain-hero { background: radial-gradient(circle at 84% 10%, rgba(34,211,238,.12), transparent 28%), linear-gradient(135deg, rgba(15,23,42,.96), rgba(2,6,23,.96)); }
  .brain-layout { display:grid; gap:1rem; align-items:start; }
  .brain-primary { display:grid; gap:1rem; }
  .brain-control-rail { min-width:0; }
  .brain-control-panel { overflow:hidden; box-shadow:0 16px 40px rgba(2,6,23,.22); }
  .brain-control-summary::-webkit-details-marker { display:none; }
  .brain-control-summary { transition:background-color .2s ease; }
  .brain-control-summary:hover { background:rgba(15,23,42,.72); }
  .brain-control-chevron { display:grid; width:1.75rem; height:1.75rem; place-items:center; border:1px solid #334155; border-radius:999px; color:#67e8f9; transition:transform .2s ease; }
  .brain-control-panel[open] .brain-control-chevron { transform:rotate(180deg); }
  .brain-control-section { margin-top:1rem; padding-top:1rem; border-top:1px solid #1e293b; }
  .brain-manage-button:hover { border-color:rgba(34,211,238,.65); color:#fff; }
  .brain-mode-pill { border-color: color-mix(in srgb, var(--mode-color) 45%, #1e293b); color: color-mix(in srgb, var(--mode-color) 78%, white); background: color-mix(in srgb, var(--mode-color) 8%, transparent); }
  .brain-mode-pill[data-selected="true"] { background: color-mix(in srgb, var(--mode-color) 22%, #020617); border-color: var(--mode-color); box-shadow: 0 0 22px color-mix(in srgb, var(--mode-color) 18%, transparent); }
  .brain-feed { position:relative; height:clamp(28rem,62vh,44rem); overflow:hidden; padding:1rem; }
  .brain-feed::before,.brain-feed::after { position:absolute; z-index:2; right:0; left:0; height:2.5rem; content:""; pointer-events:none; }
  .brain-feed::before { top:0; background:linear-gradient(#020617, transparent); }
  .brain-feed::after { bottom:0; background:linear-gradient(transparent, #020617); }
  .brain-feed-track { display:flex; flex-direction:column; gap:1rem; will-change:transform; }
  .brain-card { position:relative; flex:none; overflow:hidden; }
  .brain-card::before { position:absolute; inset:0 auto 0 0; width:3px; content:""; background:var(--mode-color); }
  .brain-category-dot { background:var(--mode-color); box-shadow:0 0 12px var(--mode-color); }
  .brain-result pre { overflow:auto; border:1px solid #1e293b; border-radius:.5rem; background:#020617; padding:.75rem; }
  .brain-result table { width:100%; border-collapse:collapse; }
  .brain-result th,.brain-result td { border-bottom:1px solid #1e293b; padding:.4rem; text-align:left; }
  .brain-switch input { position:absolute; opacity:0; }
  .brain-switch span { display:block; width:2.75rem; height:1.5rem; border-radius:999px; background:#334155; position:relative; cursor:pointer; }
  .brain-switch span::after { content:""; position:absolute; width:1.1rem; height:1.1rem; left:.2rem; top:.2rem; border-radius:50%; background:white; transition:.2s; }
  .brain-switch input:checked + span { background:#22d3ee; }
  .brain-switch input:checked + span::after { transform:translateX(1.25rem); background:#082f49; }
  .brain-chat-form { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.75rem; align-items:stretch; }
  .brain-chat-submit { min-width:5rem; background:#22d3ee; color:#082f49; transition:background-color .2s ease, transform .2s ease; }
  .brain-chat-submit:hover { background:#67e8f9; }
  .brain-chat-submit:active { transform:translateY(1px); }
  .brain-dialog::backdrop { backdrop-filter:blur(8px); }
  .brain-pulse { animation:brain-breathe 2.4s ease-in-out infinite; }
  @keyframes brain-breathe { 50% { opacity:.35; transform:scale(.8); } }
  @media (min-width:1024px) {
    .brain-layout { grid-template-columns:minmax(0,1fr) 21rem; gap:1.25rem; }
    .brain-primary { grid-column:1; grid-row:1; }
    .brain-control-rail { position:sticky; top:1rem; grid-column:2; grid-row:1; }
  }
  @media (max-width:639px) {
    .brain-shell { gap:1rem; }
    .brain-hero { padding:1.25rem; }
    .brain-feed { height:34rem; padding:.75rem; }
    .brain-chat-form { grid-template-columns:1fr; }
    .brain-chat-submit { min-height:2.75rem; }
  }
  @media (prefers-reduced-motion:reduce) { .brain-pulse { animation:none; } .brain-feed { overflow-y:auto; } .brain-feed::before,.brain-feed::after { display:none; } .brain-feed-track { transform:none!important; will-change:auto; } }
</style>
{% endblock %}
{% block content %}
<main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8"><div id="second-brain-shell">{% include "modules/second_brain/_shell.html" %}</div></main>
<script>
(function () {
  var stream, tickerFrame, tickerResumeTimer, countdownTimer, settingsDirty=false, controlsExpanded=false, currentKey = '';
  function jsonPost(url, body) { return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(async r => { var p=await r.json(); if(!r.ok) throw new Error(p.error||'Request failed'); return p; }); }
  function refreshFeed() { var visible=document.querySelector('[data-ticker-original].brain-visible');var controls=document.querySelector('[data-controls-panel]');currentKey=visible?visible.dataset.logicalKey:currentKey;controlsExpanded=controls?controls.open:controlsExpanded;htmx.ajax('GET','/second-brain/feed-fragment',{target:'#second-brain-shell',swap:'innerHTML'}); }
  function formatDuration(value) { var n=Number(value), h=Math.floor(n/60), m=n%60; return (h?h+'h ':'')+(m?m+'m':''); }
  function selectedModes() { return Array.from(document.querySelectorAll('.brain-mode-pill[data-selected="true"]')).map(x=>x.dataset.modeId); }
  function setupTicker() {
    cancelAnimationFrame(tickerFrame);clearTimeout(tickerResumeTimer);
    var feed=document.getElementById('brain-feed'),track=feed&&feed.querySelector('[data-ticker-track]');if(!track)return;
    var originals=Array.from(track.querySelectorAll('[data-ticker-original]'));if(!originals.length)return;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){originals[0].classList.add('brain-visible');return;}
    function appendCycle(){originals.forEach(card=>{var clone=card.cloneNode(true);clone.removeAttribute('data-ticker-original');clone.setAttribute('aria-hidden','true');clone.querySelectorAll('a,button,input,textarea,select').forEach(el=>el.setAttribute('tabindex','-1'));track.appendChild(clone);});}
    appendCycle();
    var cloneStart=track.querySelector('[data-feed-item][aria-hidden="true"]'),cycleHeight=cloneStart.offsetTop-originals[0].offsetTop;
    if(cycleHeight<=0)return;
    while(track.scrollHeight<feed.clientHeight+cycleHeight)appendCycle();
    var selected=originals.find(card=>card.dataset.logicalKey===currentKey);var offset=selected?selected.offsetTop-originals[0].offsetTop:0;
    var lastTime=0,paused=false,speed=12;
    function markVisible(){var marker=offset+feed.clientHeight*.18,index=0;for(var i=0;i<originals.length;i++){if(originals[i].offsetTop-originals[0].offsetTop<=marker)index=i;}originals.forEach(card=>card.classList.remove('brain-visible'));originals[index].classList.add('brain-visible');currentKey=originals[index].dataset.logicalKey;}
    function frame(time){if(!lastTime)lastTime=time;if(!paused&&cycleHeight>0){offset=(offset+(time-lastTime)*speed/1000)%cycleHeight;track.style.transform='translate3d(0,'+(-offset)+'px,0)';markVisible();}lastTime=time;tickerFrame=requestAnimationFrame(frame);}
    function pause(){paused=true;clearTimeout(tickerResumeTimer);}
    function resume(delay){clearTimeout(tickerResumeTimer);tickerResumeTimer=setTimeout(()=>{paused=false;lastTime=performance.now();},delay||0);}
    feed.addEventListener('mouseenter',pause);feed.addEventListener('mouseleave',()=>resume(800));feed.addEventListener('focusin',pause);feed.addEventListener('focusout',()=>resume(1200));feed.addEventListener('pointerdown',pause);feed.addEventListener('pointerup',()=>resume(1800));document.onvisibilitychange=()=>{if(document.hidden)pause();else resume(0);};
    markVisible();tickerFrame=requestAnimationFrame(frame);
  }
  function setupBrain() {
    setupTicker(); var shell=document.querySelector('[data-brain-shell]'); if(!shell)return;
    var controls=document.querySelector('[data-controls-panel]');if(controls){controls.open=controlsExpanded;controls.ontoggle=()=>controlsExpanded=controls.open;}
    var slider=document.getElementById('brain-duration'), label=document.getElementById('brain-duration-label'); if(slider){var remembered=sessionStorage.getItem('secondBrainDuration');if(remembered)slider.value=remembered;label.textContent=formatDuration(slider.value);slider.oninput=()=>{label.textContent=formatDuration(slider.value);sessionStorage.setItem('secondBrainDuration',slider.value);};}
    clearInterval(countdownTimer);var expires=shell.dataset.expires; if(expires){var countdown=document.getElementById('brain-countdown'); var tick=()=>{var ms=new Date(expires)-Date.now();if(ms<=0){countdown.textContent='Returning to Automatic Feed…';clearInterval(countdownTimer);setTimeout(refreshFeed,1000);return;}var min=Math.ceil(ms/60000);countdown.textContent=formatDuration(min)+' remaining';};tick();countdownTimer=setInterval(tick,30000);}
    document.querySelectorAll('.brain-mode-pill').forEach(p=>p.onclick=()=>{p.dataset.selected=p.dataset.selected==='true'?'false':'true';var modes=selectedModes();if(!modes.length){p.dataset.selected='true';return;}jsonPost('/second-brain/selection',{modes:modes,duration_minutes:Number(slider.value)}).then(refreshFeed).catch(e=>alert(e.message));});
    var automatic=document.getElementById('brain-automatic-toggle'); if(automatic)automatic.onchange=()=>jsonPost('/second-brain/automatic',{enabled:automatic.checked,modes:selectedModes(),duration_minutes:Number(slider.value)}).then(refreshFeed).catch(e=>{automatic.checked=!automatic.checked;alert(e.message);});
    document.querySelectorAll('.brain-delivery').forEach(c=>c.onchange=()=>{var s=document.getElementById('brain-delivery-status');s.textContent='Saving…';jsonPost('/second-brain/delivery/'+c.dataset.client,{enabled:c.checked}).then(()=>s.textContent='Saved.').catch(e=>{c.checked=!c.checked;s.textContent=e.message;});});
    var dialog=document.getElementById('brain-settings-dialog');document.querySelectorAll('[data-open-brain-settings]').forEach(b=>b.onclick=()=>dialog.showModal());document.querySelectorAll('[data-close-brain-settings]').forEach(b=>b.onclick=()=>{dialog.close();if(settingsDirty){settingsDirty=false;refreshFeed();}});
    async function saveCategory(form){var fd=new FormData(form);fd.set('calendar_categories',fd.getAll('calendar_choice').join(','));fd.set('operation_ids',fd.getAll('operation_choice').join(','));fd.set('client_eligibility',fd.getAll('client_choice').join(','));var status=form.querySelector('.brain-form-status');if(status)status.textContent='Saving…';var r=await fetch('/second-brain/categories',{method:'POST',body:fd});var p=await r.json();if(!r.ok){if(status)status.textContent=p.error;else alert(p.error);return false;}if(status)status.textContent='Saved.';settingsDirty=true;return true;}
    document.querySelectorAll('.brain-category-form').forEach(form=>{var timer;form.onsubmit=e=>e.preventDefault();form.onchange=()=>{clearTimeout(timer);timer=setTimeout(()=>saveCategory(form),350);};});var newForm=document.getElementById('brain-new-category');if(newForm)newForm.onsubmit=async e=>{e.preventDefault();if(await saveCategory(newForm))refreshFeed();};
    document.querySelectorAll('[data-archive-mode]').forEach(b=>b.onclick=()=>jsonPost('/second-brain/categories/'+b.dataset.archiveMode+'/archive',{}).then(refreshFeed).catch(e=>alert(e.message)));
    var hermes=document.getElementById('brain-hermes'),retention=document.getElementById('brain-chat-retention'),agentStatus=document.getElementById('brain-agent-status'); function saveAgent(){agentStatus.textContent='Saving…';jsonPost('/second-brain/agent-settings',{hermes_enabled:hermes.checked,chat_retention_hours:Number(retention.value)}).then(()=>agentStatus.textContent='Saved.').catch(e=>agentStatus.textContent=e.message);} if(hermes)hermes.onchange=saveAgent;if(retention)retention.onchange=saveAgent;
    var chat=document.getElementById('brain-chat-form'); if(chat)chat.onsubmit=async e=>{e.preventDefault();var input=document.getElementById('brain-chat-input'),status=document.getElementById('brain-chat-status'),message=input.value.trim();if(!message)return;input.value='';status.textContent='Thinking from your current briefing…';var response=await fetch('/second-brain/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:message})});var text=await response.text();if(text.includes('event: answer')){status.textContent='Answer added.';refreshFeed();}else status.textContent='Advisory answer unavailable; context was still recorded.';};
  }
  document.addEventListener('DOMContentLoaded',()=>{setupBrain();stream=new EventSource('/second-brain/api/events');stream.addEventListener('feed',refreshFeed);});document.body.addEventListener('htmx:afterSwap',setupBrain);window.addEventListener('beforeunload',()=>{if(stream)stream.close();cancelAnimationFrame(tickerFrame);clearTimeout(tickerResumeTimer);clearInterval(countdownTimer);});
})();
</script>
{% endblock %}
