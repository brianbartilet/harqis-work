<div class="shared-graph" data-shared-graph>
<script type="application/json" data-graph-data>{{ graph|tojson }}</script>
<div data-graph-canvas></div>
<details><summary>Accessible graph: {{ graph.nodes|length }} objects, {{ graph.edges|length }} connections</summary>
<ul>{% for node in graph.nodes %}<li>{{ node.label }} ({{ node.kind }})</li>{% endfor %}</ul>
</details>
</div>
