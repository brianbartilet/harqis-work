<section id="butler-briefings" role="tabpanel" aria-labelledby="butler-briefings-open" hidden>
  <form id="butler-briefings-form">
    <h2 id="butler-briefings-title">Briefing settings</h2>
    <p>The worker delivers to Butler → Briefings after the selected hour. Missed days are skipped.</p>
    <p id="butler-briefings-loading" role="status">Loading schedule...</p>
    <fieldset id="butler-briefings-fields" disabled>
      <div class="butler-briefing-field"><label for="butler-briefings-cadence">Frequency</label><select id="butler-briefings-cadence" name="cadence"><option value="off">Off</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select></div>
      <div class="butler-briefing-field"><label for="butler-briefings-hour">Hour (0–23)</label><div class="butler-hour-control"><input id="butler-briefings-hour" name="hour" type="number" min="0" max="23" step="1" required><span class="butler-hour-steppers">
        <button type="button" id="butler-hour-up" aria-label="Increase hour"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="m5 12.5 5-5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" id="butler-hour-down" aria-label="Decrease hour"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="m5 7.5 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </span></div></div>
      <div class="butler-briefing-field" id="butler-briefings-day" hidden><label for="butler-briefings-weekday">Day</label><select id="butler-briefings-weekday" name="weekday">{% for day in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}<option value="{{ loop.index0 }}">{{ day }}</option>{% endfor %}</select></div>
      <label class="butler-timezone-field">Timezone<input id="butler-briefings-timezone" readonly aria-describedby="butler-timezone-help"><span id="butler-timezone-help">Uses your <a href="/profile">Profile timezone</a>.</span></label>
    </fieldset>
    <p id="butler-briefings-error" role="alert"></p>
    <div class="butler-settings-actions"><button type="button" id="butler-briefings-close">Cancel</button><button type="submit" id="butler-briefings-save" disabled>Save schedule</button></div>
  </form>
</section>
