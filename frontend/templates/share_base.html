<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Shared context · HARQIS{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #020617; color: #e2e8f0; line-height: 1.55; }
    a { color: #7dd3fc; }
    button, input, textarea { font: inherit; }
    .shell { width: min(880px, calc(100% - 32px)); margin: 0 auto; }
    .header { border-bottom: 1px solid #1e293b; padding: 18px 0; }
    .brand { color: #f8fafc; font-weight: 750; text-decoration: none; letter-spacing: .02em; }
    .main { padding: 32px 0 64px; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 22px; margin-bottom: 18px; }
    .muted { color: #94a3b8; }
    .eyebrow { color: #38bdf8; font-size: .76rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3 { color: #f8fafc; line-height: 1.2; overflow-wrap: anywhere; }
    h1 { font-size: clamp(1.65rem, 6vw, 2.4rem); margin: 8px 0 12px; }
    h2 { font-size: 1.15rem; margin: 0 0 14px; }
    label { display: block; color: #cbd5e1; font-size: .88rem; font-weight: 650; margin-bottom: 6px; }
    input[type="text"], input[type="password"], input[type="search"], textarea {
      width: 100%; background: #020617; border: 1px solid #334155; border-radius: 9px;
      color: #f8fafc; padding: 11px 12px;
    }
    textarea { resize: vertical; }
    input:focus, textarea:focus { border-color: #38bdf8; outline: 2px solid rgba(56,189,248,.2); }
    button, .button {
      display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 9px;
      background: #0284c7; color: white; cursor: pointer; font-weight: 700; padding: 10px 15px;
      text-decoration: none;
    }
    .button-secondary { background: #1e293b; color: #e2e8f0; }
    .notice { border-left: 3px solid #38bdf8; padding: 10px 13px; background: #082f49; border-radius: 7px; }
    .error { border-left-color: #fb7185; background: #4c0519; }
    .hero-card { background: linear-gradient(135deg,#0f172a,#111c35); }
    .audit-note { color:#64748b; font-size:.82rem; margin-bottom:0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: #172554; border-radius: 999px; color: #bfdbfe; font-size: .75rem; padding: 3px 8px; }
    .chip-source { background:#083344; color:#a5f3fc; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; }
    .suggestion { background:#172554; color:#bfdbfe; font-size:.78rem; font-weight:600; padding:7px 10px; text-align:left; }
    .suggestion:hover { background:#1e3a8a; }
    .chat-thread { display:flex; max-height:520px; flex-direction:column; gap:16px; overflow-y:auto; margin:18px -6px; padding:6px; }
    .chat-message { display:flex; align-items:flex-start; gap:10px; }
    .chat-user { flex-direction:row-reverse; }
    .chat-avatar { display:grid; width:32px; height:32px; flex:0 0 32px; place-items:center; border-radius:999px; background:#1e3a8a; color:#dbeafe; font-size:.75rem; font-weight:800; }
    .chat-user .chat-avatar { background:#064e3b; color:#d1fae5; }
    .chat-bubble { max-width:min(78%,680px); border:1px solid #1e293b; border-radius:14px; background:#020617; padding:12px 14px; }
    .chat-user .chat-bubble { background:#052e2b; border-color:#115e59; }
    .chat-meta { display:flex; align-items:center; justify-content:space-between; gap:16px; color:#64748b; font-size:.7rem; }
    .chat-meta strong { color:#cbd5e1; font-size:.76rem; }
    .chat-empty, .empty-state { border:1px dashed #334155; border-radius:12px; color:#94a3b8; padding:20px; text-align:center; }
    .compose-row, .search-row { display:flex; align-items:flex-end; gap:10px; }
    .compose-row textarea { min-height:52px; }
    .entries-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
    .entry-search { width:min(100%,380px); }
    .entry { scroll-margin-top:18px; border-top:1px solid #1e293b; padding:24px 0; }
    .entry-header h3 { margin:0 0 10px; font-size:1.08rem; }
    .entry-tags { margin-bottom:12px; }
    .entry-source { display:flex; align-items:center; gap:8px; margin:12px 0; color:#94a3b8; font-size:.78rem; }
    .entry-content { margin-left:14px; padding-left:16px; border-left:2px solid #1e3a8a; }
    .entry-references { margin:16px 0 0 30px; }
    .reference-links { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .reference-links a { border-radius:8px; background:#082f49; padding:6px 9px; text-decoration:none; }
    .pagination { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; border-top:1px solid #1e293b; padding-top:20px; }
    .pagination a, .pagination span { color:#7dd3fc; text-decoration:none; }
    .pagination a:last-child, .pagination span:last-child { text-align:right; }
    .pagination span[aria-disabled="true"] { color:#475569; }
    .pagination strong { color:#94a3b8; font-size:.78rem; }
    .markdown-body { color:#cbd5e1; line-height:1.65; overflow-wrap:anywhere; }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin:.65rem 0; }
    .markdown-body ul, .markdown-body ol { padding-left:1.35rem; }
    .markdown-body a { color:#7dd3fc; font-weight:650; }
    .markdown-body code { border-radius:4px; background:#0f172a; padding:2px 4px; }
    .markdown-body pre { overflow-x:auto; border-radius:10px; background:#0f172a; padding:12px; }
    .wait-overlay { position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(2,6,23,.88); padding:20px; backdrop-filter:blur(7px); }
    .wait-overlay[hidden] { display:none; }
    .wait-card { width:min(360px,100%); border:1px solid #1e3a8a; border-radius:16px; background:#0f172a; padding:26px; text-align:center; box-shadow:0 24px 80px rgba(0,0,0,.5); }
    .wait-spinner { width:42px; height:42px; margin:0 auto; border:4px solid #1e3a8a; border-top-color:#60a5fa; border-radius:999px; animation:wait-spin .85s linear infinite; }
    @keyframes wait-spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce) { .wait-spinner { animation-duration:2.5s; } }
    @media (max-width: 520px) {
      .shell { width: min(100% - 20px, 880px); }
      .main { padding-top: 20px; }
      .card { border-radius: 12px; padding: 17px; }
      button, .button { width: 100%; }
      .compose-row, .search-row { align-items:stretch; flex-direction:column; }
      .chat-bubble { max-width:calc(100% - 42px); }
      .pagination { grid-template-columns:1fr 1fr; }
      .pagination strong { grid-column:1 / -1; grid-row:1; text-align:center; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="shell"><span class="brand">HARQIS · Shared context</span></div>
  </header>
  <main class="shell main">{% block content %}{% endblock %}</main>
</body>
</html>
