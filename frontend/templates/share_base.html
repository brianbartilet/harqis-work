<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Shared context · HARQIS{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { max-width:100%; margin:0; overflow-x:hidden; background:#020617; color:#e2e8f0; line-height:1.55; }
    a { color: #7dd3fc; max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
    button, input, textarea { font: inherit; }
    button:disabled { cursor: wait; opacity: .65; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .header { min-height: 58px; border-bottom: 1px solid #1e293b; padding: 16px 0; }
    .header .shell { width:min(1500px,calc(100% - 24px)); }
    .brand { display:inline-flex; min-width:0; align-items:center; gap:10px; color:#f8fafc; font-weight:750; text-decoration:none; letter-spacing:.02em; }
    .brand-logo { display:grid; width:30px; height:30px; flex:0 0 30px; place-items:center; border:1px solid rgba(59,130,246,.3); border-radius:8px; background:rgba(37,99,235,.2); color:#60a5fa; }
    .brand-logo svg { width:16px; height:16px; }
    .brand-copy { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .main { padding: 28px 0 56px; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 22px; margin-bottom: 18px; }
    .muted { color: #94a3b8; }
    .eyebrow { margin: 0 0 6px; color: #38bdf8; font-size: .7rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3 { color: #f8fafc; line-height: 1.2; overflow-wrap: anywhere; }
    h1 { font-size: clamp(1.45rem, 4vw, 2.15rem); margin: 6px 0 10px; }
    h2 { font-size: 1.15rem; margin: 0 0 14px; }
    label { display: block; color: #cbd5e1; font-size: .82rem; font-weight: 650; margin-bottom: 6px; }
    input[type="text"], input[type="password"], input[type="search"], textarea {
      width: 100%; background: #020617; border: 1px solid #334155; border-radius: 9px;
      color: #f8fafc; padding: 10px 12px;
    }
    textarea { resize: vertical; }
    input:focus, textarea:focus { border-color: #38bdf8; outline: 2px solid rgba(56,189,248,.2); }
    button, .button {
      display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 9px;
      background: #0284c7; color: white; cursor: pointer; font-weight: 700; padding: 10px 15px;
      text-decoration: none;
    }
    .button-secondary { background: #1e293b; color: #e2e8f0; }
    .notice { border-left: 3px solid #38bdf8; padding: 10px 13px; background: #082f49; border-radius: 7px; }
    .error { border-left-color: #fb7185; background: #4c0519; }
    .audit-note { color:#64748b; font-size:.78rem; margin:8px 0 0; }
    .preview-toast { position:fixed; top:72px; right:18px; z-index:60; display:flex; width:min(430px,calc(100% - 36px)); align-items:flex-start; justify-content:space-between; gap:12px; border:1px solid #d97706; border-radius:12px; background:#451a03; color:#fef3c7; padding:11px 12px 11px 14px; box-shadow:0 18px 55px rgba(0,0,0,.48); }
    .preview-toast > div { display:flex; min-width:0; flex-direction:column; gap:2px; }
    .preview-toast strong { color:#fde68a; }
    .preview-toast span { font-size:.78rem; }
    .preview-toast-close { width:28px; height:28px; flex:0 0 28px; border-radius:7px; background:rgba(120,53,15,.75); color:#fde68a; padding:0; }
    .preview-toast-close:hover { background:#92400e; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { background: #172554; border-radius: 999px; color: #bfdbfe; font-size: .68rem; padding: 2px 7px; }
    .chip-source { background:#083344; color:#a5f3fc; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .markdown-body, .entry-content, .reference-links { min-width: 0; max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
    .markdown-body { color:#cbd5e1; line-height:1.65; }
    .markdown-body.is-typing::after { content:"▋"; display:inline-block; margin-left:2px; color:#60a5fa; animation:typing-cursor .8s steps(1,end) infinite; }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin:.65rem 0; }
    .markdown-body ul, .markdown-body ol { padding-left:1.35rem; }
    .markdown-body a { color:#7dd3fc; font-weight:650; }
    .markdown-body a[href*="#evidence-"] { display:inline-block; margin-left:.3em; font-weight:400; white-space:nowrap; }
    .markdown-body code { border-radius:4px; background:#0f172a; padding:2px 4px; }
    .markdown-body pre { max-width:100%; overflow-x:auto; border-radius:10px; background:#0f172a; padding:12px; }

    .share-main { width: min(1500px, calc(100% - 24px)); height: calc(100dvh - 58px); padding: 12px 0; }
    .share-workspace { --drawer-width:clamp(300px,25vw,480px); position:relative; display:grid; height:100%; min-height:0; grid-template-columns:var(--drawer-width) minmax(0,1fr); overflow:hidden; border:1px solid #1e293b; border-radius:16px; background:#0b1221; box-shadow:0 20px 70px rgba(0,0,0,.3); }
    .drawer-state { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    .entry-drawer { display:flex; min-width:0; flex-direction:column; overflow:hidden; border-right:1px solid #1e293b; background:#07101f; transition:margin .2s ease, transform .2s ease; }
    .drawer-collapsed { grid-template-columns:0 minmax(0,1fr); }
    .drawer-collapsed .entry-drawer { margin-left:calc(-1 * var(--drawer-width)); }
    .share-workspace:has(.drawer-state:checked) { grid-template-columns:0 minmax(0,1fr); }
    .share-workspace:has(.drawer-state:checked) .entry-drawer { margin-left:calc(-1 * var(--drawer-width)); }
    .drawer-head { display:flex; height:74px; min-height:74px; flex:0 0 74px; align-items:flex-start; justify-content:space-between; gap:10px; border-bottom:1px solid #1e293b; padding:15px; }
    .drawer-head h2 { margin:0; font-size:.96rem; }
    .drawer-close, .drawer-toggle { display:grid; width:36px; height:36px; flex:0 0 36px; place-items:center; border:0; border-radius:9px; background:#172033; color:#cbd5e1; cursor:pointer; font-weight:700; padding:0; user-select:none; }
    .drawer-close:focus-visible, .drawer-toggle:focus-visible { outline:2px solid #38bdf8; outline-offset:2px; }
    .drawer-search { border-bottom:1px solid #1e293b; padding:12px; }
    .drawer-search, .drawer-search input { width:100%; min-width:0; max-width:100%; overflow:hidden; }
    .drawer-count { margin:9px 0 0; color:#64748b; font-size:.7rem; }
    .entry-list { min-height:0; flex:1; overflow-y:auto; padding:0 12px; }
    .entry { border-bottom:1px solid #1e293b; padding:14px 2px; font-size:.78rem; }
    .entry.is-cited-evidence { margin:6px 0; border:1px solid #2563eb; border-radius:10px; background:rgba(30,58,138,.18); padding:13px 10px; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    .entry:last-child { border-bottom:0; }
    .entry-header h3 { margin:0 0 7px; font-size:.88rem; }
    .entry-tags { margin-bottom:8px; }
    .entry-source { display:flex; align-items:center; gap:6px; margin:8px 0; color:#94a3b8; font-size:.7rem; }
    .entry-content { margin:8px 0 0 6px; padding-left:10px; border-left:2px solid #1e3a8a; color:#94a3b8; line-height:1.5; }
    .entry-content img, .entry-content video { display:block; width:100%; max-width:100%; height:auto; margin:8px 0; border-radius:8px; background:#020617; object-fit:contain; }
    .entry-content iframe { display:block; width:100%; max-width:100%; aspect-ratio:16 / 9; margin:8px 0; border:0; border-radius:8px; background:#020617; }
    .entry-content h1, .entry-content h2, .entry-content h3 { font-size:.82rem; }
    .entry-references { margin:10px 0 0 16px; }
    .entry-references strong { font-size:.7rem; }
    .reference-links { display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin-top:6px; }
    .reference-links a { display:block; width:100%; border-radius:7px; background:#082f49; padding:6px 8px; text-decoration:none; }
    .entry-load-status { display:flex; align-items:center; justify-content:center; gap:8px; min-height:64px; color:#64748b; font-size:.7rem; text-align:center; }
    .entry-stream-end { margin:0; border-top:1px solid #1e293b; color:#475569; font-size:.68rem; padding:14px 4px; text-align:center; }

    .chat-workspace { display:grid; min-width:0; min-height:0; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto; background:radial-gradient(circle at top,#111c35 0,#0b1221 34%,#080f1c 100%); }
    .workspace-header { display:flex; width:100%; min-width:0; max-width:100%; height:74px; min-height:74px; align-items:center; justify-content:space-between; gap:14px; overflow:hidden; border-bottom:1px solid #1e293b; padding:11px 16px; background:rgba(11,18,33,.9); }
    .workspace-heading { min-width:0; flex:1; }
    .workspace-heading h1 { margin:0; font-size:1.03rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .workspace-heading p { margin:2px 0 0; font-size:.7rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .logout-form { flex:0 0 auto; }
    .logout-form button { padding:8px 11px; font-size:.72rem; }
    .chat-scroll { min-height:0; overflow-x:hidden; overflow-y:auto; scroll-behavior:smooth; }
    .chat-content { width:min(820px,calc(100% - 32px)); margin:0 auto; padding:30px 0 20px; }
    .chat-intro { margin-bottom:18px; }
    .chat-intro h2 { margin:0 0 8px; font-size:1.5rem; }
    .chat-intro p { margin:6px 0; }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 24px; }
    .suggestion { background:#172554; color:#bfdbfe; font-size:.75rem; font-weight:600; padding:7px 10px; text-align:left; }
    .suggestion:hover { background:#1e3a8a; }
    .chat-thread { display:flex; min-width:0; max-width:100%; flex-direction:column; gap:18px; overflow-x:hidden; padding:4px 0 16px; }
    .chat-message { display:flex; width:100%; min-width:0; max-width:100%; align-items:flex-start; gap:10px; }
    .chat-user { flex-direction:row-reverse; }
    .chat-avatar { display:grid; width:32px; height:32px; flex:0 0 32px; place-items:center; border-radius:999px; background:#1e3a8a; color:#dbeafe; font-size:.75rem; font-weight:800; }
    .chat-user .chat-avatar { background:#064e3b; color:#d1fae5; }
    .chat-bubble { min-width:0; max-width:min(82%,680px); overflow:hidden; border:1px solid #1e293b; border-radius:14px; background:#020617; padding:12px 14px; }
    .chat-user .chat-bubble { background:#052e2b; border-color:#115e59; }
    .chat-meta { display:flex; align-items:center; justify-content:space-between; gap:16px; color:#64748b; font-size:.68rem; }
    .chat-meta strong { color:#cbd5e1; font-size:.74rem; }
    .chat-empty, .empty-state { border:1px dashed #334155; border-radius:12px; color:#94a3b8; padding:18px; text-align:center; }
    .typing-dots { display:inline-flex; align-items:center; gap:5px; min-height:24px; }
    .typing-dots span { width:7px; height:7px; border-radius:999px; background:#60a5fa; animation:typing-pulse 1.1s infinite ease-in-out; }
    .typing-dots span:nth-child(2) { animation-delay:.14s; }
    .typing-dots span:nth-child(3) { animation-delay:.28s; }
    .chat-compose { border-top:1px solid #1e293b; background:rgba(7,16,31,.96); padding:12px 16px 14px; }
    .chat-compose[aria-busy="true"] { border-top-color:#2563eb; }
    .compose-inner { width:min(820px,100%); margin:0 auto; }
    .compose-row { display:flex; align-items:flex-end; gap:10px; }
    .compose-row textarea { width:auto; min-width:0; min-height:50px; max-height:160px; flex:1 1 auto; resize:none; }
    .compose-row button { flex:0 0 auto; }
    .chat-error { margin:4px 42px 0; }
    .drawer-backdrop { display:none; }

    .wait-overlay { position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(2,6,23,.88); padding:20px; backdrop-filter:blur(7px); }
    .wait-overlay[hidden] { display:none; }
    .wait-card { width:min(360px,100%); border:1px solid #1e3a8a; border-radius:16px; background:#0f172a; padding:26px; text-align:center; box-shadow:0 24px 80px rgba(0,0,0,.5); }
    .wait-spinner { width:42px; height:42px; margin:0 auto; border:4px solid #1e3a8a; border-top-color:#60a5fa; border-radius:999px; animation:wait-spin .85s linear infinite; }
    @keyframes wait-spin { to { transform:rotate(360deg); } }
    @keyframes typing-pulse { 0%,60%,100% { opacity:.32; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }
    @keyframes typing-cursor { 0%,45% { opacity:1; } 46%,100% { opacity:0; } }
    @media (prefers-reduced-motion:reduce) {
      .wait-spinner { animation-duration:2.5s; }
      .typing-dots span { animation:none; opacity:.8; }
      .markdown-body.is-typing::after { animation:none; }
    }
    @media (min-width: 901px) {
      .drawer-collapsed .chat-content,
      .share-workspace:has(.drawer-state:checked) .chat-content,
      .drawer-collapsed .compose-inner,
      .share-workspace:has(.drawer-state:checked) .compose-inner {
        width:min(1120px,calc(100% - 48px));
      }
    }
    @media (max-width: 900px) {
      .share-main.shell { width:auto; max-width:none; height:calc(100dvh - 58px); min-height:0; margin:0; padding:0; }
      .share-workspace { display:block; width:auto; max-width:none; height:100%; min-height:0; margin:0; border:0; border-radius:0; }
      .chat-workspace { position:absolute; inset:0; width:auto; max-width:none; height:auto; min-width:0; overflow:hidden; }
      .entry-drawer { position:absolute; inset:0; z-index:30; width:auto; max-width:none; border-right:0; box-shadow:none; transform:translateX(-105%); }
      .drawer-open .entry-drawer { transform:translateX(0); }
      .drawer-collapsed .entry-drawer { margin-left:0; }
      .share-workspace:has(.drawer-state:checked) { display:block; }
      .share-workspace:has(.drawer-state:checked) .entry-drawer { margin-left:0; transform:translateX(0); }
      .drawer-backdrop { position:absolute; inset:0; z-index:20; background:rgba(2,6,23,.7); }
      .drawer-open .drawer-backdrop { display:block; }
      .drawer-state:checked ~ .drawer-backdrop { display:block; }
    }
    @media (max-width: 520px) {
      body { font-size:14px; line-height:1.45; }
      .shell { width:min(100% - 20px,1180px); }
      .header .shell { width:calc(100% - 20px); }
      .header { min-height:54px; padding:14px 0; }
      .brand { display:inline-flex; max-width:100%; gap:8px; font-size:.72rem; }
      .brand-logo { width:26px; height:26px; flex-basis:26px; border-radius:7px; }
      .brand-logo svg { width:14px; height:14px; }
      .share-main.shell { width:auto; max-width:none; height:calc(100dvh - 54px); margin:0; }
      .workspace-header { gap:9px; padding:9px 10px; }
      .workspace-heading h1 { font-size:.94rem; }
      .workspace-heading p { font-size:.62rem; }
      a.logout-form, .logout-form button { width:auto; min-width:0; height:36px; flex:0 0 auto; padding:8px 10px; white-space:nowrap; }
      form.logout-form { width:auto; height:auto; flex:0 0 auto; padding:0; }
      .share-main, .share-workspace, .chat-workspace, .chat-scroll { min-width:0; }
      .chat-scroll { width:auto; max-width:none; }
      .chat-workspace > * { min-width:0; max-width:100%; }
      .chat-content { width:auto; max-width:none; margin:0; padding:16px 12px 14px; overflow:hidden; }
      .chat-intro, .chat-intro p, .suggestions, .chat-thread { width:100%; min-width:0; max-width:100%; white-space:normal; overflow-wrap:anywhere; }
      .chat-intro { margin-bottom:14px; }
      .chat-intro h2 { font-size:1.18rem; }
      .chat-intro .muted { font-size:.9rem; line-height:1.48; }
      .audit-note { font-size:.68rem; line-height:1.45; }
      .suggestions { display:grid; grid-template-columns:minmax(0,1fr); gap:7px; overflow:visible; margin:12px 0 16px; padding:0; }
      .suggestion { width:100%; max-width:100%; min-width:0; justify-content:flex-start; overflow-wrap:anywhere; white-space:normal; font-size:.68rem; line-height:1.35; padding:7px 9px; text-align:left; }
      .chat-bubble { width:calc(100% - 42px); min-width:0; max-width:calc(100% - 42px); }
      .chat-bubble { padding:10px 11px; font-size:.86rem; }
      .chat-meta, .chat-meta strong { font-size:.62rem; }
      .chat-bubble .markdown-body, .chat-bubble .markdown-body * { max-width:100%; overflow-wrap:anywhere; word-break:break-word; }
      .chat-empty { padding:14px 12px; font-size:.86rem; }
      .chat-compose { width:auto; max-width:none; padding:8px 10px 9px; overflow:hidden; }
      .compose-inner { width:auto; min-width:0; max-width:none; }
      .compose-row { display:grid; width:100%; min-width:0; grid-template-columns:minmax(0,1fr); align-items:stretch; gap:7px; }
      .compose-inner label { font-size:.72rem; }
      .compose-row textarea { width:100%; min-width:0; min-height:44px; font-size:.86rem; padding:9px 10px; }
      .compose-row button { width:100%; min-height:38px; padding:7px 12px; font-size:.86rem; }
      .preview-toast { top:64px; right:10px; width:calc(100% - 20px); }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="shell">
      <span class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
          </svg>
        </span>
        <span class="brand-copy">HARQIS - Knowledge Corpus Share</span>
      </span>
    </div>
  </header>
  <main class="shell main{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
